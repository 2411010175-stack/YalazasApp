<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>

    <linearGradient id="presGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <linearGradient id="domGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="shadow2" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad2)"/>

  <!-- Header -->
  <text x="600" y="50" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" letter-spacing="3">ORGANIZACIÓN MODULAR DEL SOFTWARE</text>
  <text x="600" y="85" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28" font-weight="800">Estilo en Capas (Layered / Clean Architecture)</text>

  <!-- LAYER 1: PRESENTACIÓN -->
  <g filter="url(#shadow2)">
    <rect x="100" y="125" width="1000" height="135" rx="16" fill="#1E293B" stroke="#F97316" stroke-width="2"/>
    <rect x="120" y="145" width="220" height="32" rx="8" fill="url(#presGrad)"/>
    <text x="230" y="166" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">1. CAPA DE PRESENTACIÓN (UI)</text>

    <text x="125" y="202" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Responsabilidad: "La View solo dibuja e interactúa"</text>
    <text x="125" y="224" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">• Componentes: MenuFragment, AdminDashboardFragment, CartFragment, Adapters, XML Layouts.</text>
    <text x="125" y="244" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">• Principio: Cero lógica de negocio. Solo captura eventos de usuario y renderiza el estado emitido.</text>

    <!-- Tag -->
    <rect x="880" y="145" width="200" height="40" rx="10" fill="#0F172A" stroke="#475569"/>
    <text x="980" y="170" text-anchor="middle" fill="#FDBA74" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Fragments + LiveData Obs</text>
  </g>

  <!-- ARROW 1 -> 2 -->
  <path d="M 600 260 L 600 290" stroke="#F97316" stroke-width="3" marker-end="url(#arrow)"/>
  <polygon points="600,295 593,283 607,283" fill="#F97316"/>

  <!-- LAYER 2: DOMINIO / ESTADO -->
  <g filter="url(#shadow2)">
    <rect x="100" y="300" width="1000" height="145" rx="16" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="120" y="320" width="240" height="32" rx="8" fill="url(#domGrad)"/>
    <text x="240" y="341" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">2. CAPA DE DOMINIO Y ESTADO</text>

    <text x="125" y="377" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Responsabilidad: "Gestionar el estado y orquestar flujos"</text>
    <text x="125" y="399" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">• Componentes: MenuViewModel, AuthViewModel, Sealed Classes (MenuState: Loading/Success/Error).</text>
    <text x="125" y="419" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">• Principio: Sobrevive a cambios de configuración (rotación de pantalla) y gestiona asincronía con Coroutines.</text>

    <!-- Tag -->
    <rect x="880" y="320" width="200" height="40" rx="10" fill="#0F172A" stroke="#475569"/>
    <text x="980" y="345" text-anchor="middle" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">ViewModel + viewModelScope</text>
  </g>

  <!-- ARROW 2 -> 3 -->
  <path d="M 600 445 L 600 475" stroke="#8B5CF6" stroke-width="3"/>
  <polygon points="600,480 593,468 607,468" fill="#8B5CF6"/>

  <!-- LAYER 3: DATOS -->
  <g filter="url(#shadow2)">
    <rect x="100" y="485" width="1000" height="145" rx="16" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <rect x="120" y="505" width="220" height="32" rx="8" fill="url(#dataGrad)"/>
    <text x="230" y="526" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">3. CAPA DE DATOS (DATA)</text>

    <text x="125" y="562" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Responsabilidad: "Consultar, mapear y persistir información"</text>
    <text x="125" y="584" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">• Componentes: ProductRepository, AuthRepository, CartRepository, Modelos (Product, Order, Role).</text>
    <text x="125" y="604" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">• Fuente Externa: Firebase Firestore (NoSQL), Firebase Authentication y Firebase Cloud Storage.</text>

    <!-- Tag -->
    <rect x="880" y="505" width="200" height="40" rx="10" fill="#0F172A" stroke="#475569"/>
    <text x="980" y="530" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Repository + Firestore</text>
  </g>
</svg>