<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="viewGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <linearGradient id="vmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>

    <linearGradient id="repoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="fbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="shadow3" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad3)"/>

  <!-- Header -->
  <text x="600" y="45" text-anchor="middle" fill="#F97316" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" letter-spacing="3">PATRÓN ARQUITECTÓNICO OFICIAL ANDROID</text>
  <text x="600" y="80" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28" font-weight="800">Flujo de Datos Unidireccional en MVVM (Yalazas)</text>

  <!-- 4 COLUMNS: VIEW -> VIEWMODEL -> REPOSITORY -> FIREBASE -->

  <!-- CARD 1: VIEW -->
  <g filter="url(#shadow3)">
    <rect x="50" y="125" width="240" height="490" rx="16" fill="#1E293B" stroke="#F97316" stroke-width="2"/>
    <rect x="70" y="145" width="200" height="36" rx="8" fill="url(#viewGrad)"/>
    <text x="170" y="169" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">VIEW (VISTA)</text>

    <text x="70" y="210" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">"Solo Dibuja"</text>
    <text x="70" y="235" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• MenuFragment.kt</text>
    <text x="70" y="255" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• AdminDashboardFragment</text>
    <text x="70" y="275" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• ProductAdapter.kt</text>
    <text x="70" y="295" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• XML Layouts / Views</text>

    <rect x="65" y="325" width="210" height="150" rx="10" fill="#0F172A" stroke="#334155"/>
    <text x="75" y="348" fill="#F97316" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Funciones Clave:</text>
    <text x="75" y="370" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">1. Captura acciones del</text>
    <text x="75" y="388" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">   usuario (clic, swipe).</text>
    <text x="75" y="410" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">2. Observa LiveData</text>
    <text x="75" y="428" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">   (Loading/Success/Error).</text>
    <text x="75" y="450" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">3. Cero lógica de negocio.</text>

    <rect x="65" y="490" width="210" height="105" rx="10" fill="#431407" stroke="#EA580C"/>
    <text x="170" y="515" text-anchor="middle" fill="#FDBA74" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Lifecycle Owner</text>
    <text x="75" y="540" fill="#FED7AA" font-family="system-ui, sans-serif" font-size="11">Se destruye y recrea en</text>
    <text x="75" y="558" fill="#FED7AA" font-family="system-ui, sans-serif" font-size="11">rotaciones, pero no pierde</text>
    <text x="75" y="576" fill="#FED7AA" font-family="system-ui, sans-serif" font-size="11">datos gracias al ViewModel.</text>
  </g>

  <!-- CARD 2: VIEWMODEL -->
  <g filter="url(#shadow3)">
    <rect x="335" y="125" width="255" height="490" rx="16" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="355" y="145" width="215" height="36" rx="8" fill="url(#vmGrad)"/>
    <text x="462" y="169" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">VIEWMODEL</text>

    <text x="355" y="210" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">"Gestor de Estado"</text>
    <text x="355" y="235" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• MenuViewModel.kt</text>
    <text x="355" y="255" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• AuthViewModel.kt</text>
    <text x="355" y="275" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• MutableLiveData&lt;MenuState&gt;</text>
    <text x="355" y="295" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• viewModelScope.launch { }</text>

    <rect x="350" y="325" width="225" height="150" rx="10" fill="#0F172A" stroke="#334155"/>
    <text x="360" y="348" fill="#A78BFA" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Funciones Clave:</text>
    <text x="360" y="370" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">1. Lanza Coroutines en</text>
    <text x="360" y="388" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">   hilos en segundo plano.</text>
    <text x="360" y="410" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">2. Modifica el estado UI</text>
    <text x="360" y="428" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">   (Loading ➔ Success/Error).</text>
    <text x="360" y="450" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">3. Desacoplado de vistas Android.</text>

    <rect x="350" y="490" width="225" height="105" rx="10" fill="#2E1065" stroke="#7C3AED"/>
    <text x="462" y="515" text-anchor="middle" fill="#DDD6FE" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">🛡️ Supervivencia de Estado</text>
    <text x="360" y="540" fill="#E9D5FF" font-family="system-ui, sans-serif" font-size="11">Sobrevive a cambios de</text>
    <text x="360" y="558" fill="#E9D5FF" font-family="system-ui, sans-serif" font-size="11">configuración como rotar</text>
    <text x="360" y="576" fill="#E9D5FF" font-family="system-ui, sans-serif" font-size="11">el teléfono sin re-consultar.</text>
  </g>

  <!-- CARD 3: REPOSITORY -->
  <g filter="url(#shadow3)">
    <rect x="635" y="125" width="250" height="490" rx="16" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <rect x="655" y="145" width="210" height="36" rx="8" fill="url(#repoGrad)"/>
    <text x="760" y="169" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">REPOSITORY</text>

    <text x="655" y="210" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">"Única Fuente de Verdad"</text>
    <text x="655" y="235" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• ProductRepository.kt</text>
    <text x="655" y="255" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• AuthRepository.kt</text>
    <text x="655" y="275" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• CartRepository.kt</text>
    <text x="655" y="295" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Data Models (DTO / Entities)</text>

    <rect x="650" y="325" width="220" height="150" rx="10" fill="#0F172A" stroke="#334155"/>
    <text x="660" y="348" fill="#34D399" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Funciones Clave:</text>
    <text x="660" y="370" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">1. Métodos 'suspend' no</text>
    <text x="660" y="388" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">   bloqueantes (Result&lt;T&gt;).</text>
    <text x="660" y="410" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">2. Abstrae la fuente de datos</text>
    <text x="660" y="428" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">   (remota o local en caché).</text>
    <text x="660" y="450" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">3. Mapea datos a objetos.</text>

    <rect x="650" y="490" width="220" height="105" rx="10" fill="#064E3B" stroke="#059669"/>
    <text x="760" y="515" text-anchor="middle" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">🔌 Desacoplamiento de API</text>
    <text x="660" y="540" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="11">Si cambiamos de Firebase a</text>
    <text x="660" y="558" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="11">otra API REST, la UI y el</text>
    <text x="660" y="576" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="11">ViewModel no sufren cambios.</text>
  </g>

  <!-- CARD 4: CLOUD BACKEND (FIREBASE) -->
  <g filter="url(#shadow3)">
    <rect x="930" y="125" width="220" height="490" rx="16" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <rect x="950" y="145" width="180" height="36" rx="8" fill="url(#fbGrad)"/>
    <text x="1040" y="169" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">FIREBASE BAAS</text>

    <text x="950" y="210" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">"Nube Serverless"</text>
    <text x="950" y="235" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Cloud Firestore (NoSQL)</text>
    <text x="950" y="255" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Firebase Auth (Tokens)</text>
    <text x="950" y="275" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Firebase Storage</text>
    <text x="950" y="295" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• Collections: products, orders</text>

    <rect x="945" y="325" width="190" height="150" rx="10" fill="#0F172A" stroke="#334155"/>
    <text x="955" y="348" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Servicios Activos:</text>
    <text x="955" y="370" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">1. Consultas y filtrado</text>
    <text x="955" y="388" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">   en tiempo real.</text>
    <text x="955" y="410" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">2. Autoescalabilidad.</text>
    <text x="955" y="428" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">3. Manejo de sesiones</text>
    <text x="955" y="450" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">   con Firebase Auth.</text>

    <rect x="945" y="490" width="190" height="105" rx="10" fill="#451A03" stroke="#B45309"/>
    <text x="1040" y="515" text-anchor="middle" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">⚡ Alta Disponibilidad</text>
    <text x="955" y="540" fill="#FEF3C7" font-family="system-ui, sans-serif" font-size="11">Infraestructura 99.95%</text>
    <text x="955" y="558" fill="#FEF3C7" font-family="system-ui, sans-serif" font-size="11">gestionada por Google</text>
    <text x="955" y="576" fill="#FEF3C7" font-family="system-ui, sans-serif" font-size="11">Cloud sin servidores.</text>
  </g>

  <!-- CONNECTING ARROWS -->
  <!-- View -> VM (Events) -->
  <path d="M 290 200 L 335 200" stroke="#F97316" stroke-width="2.5"/>
  <polygon points="335,200 325,195 325,205" fill="#F97316"/>
  <text x="312" y="190" text-anchor="middle" fill="#F97316" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">Eventos</text>

  <!-- VM -> View (State) -->
  <path d="M 335 240 L 290 240" stroke="#8B5CF6" stroke-width="2.5"/>
  <polygon points="290,240 300,235 300,245" fill="#8B5CF6"/>
  <text x="312" y="255" text-anchor="middle" fill="#8B5CF6" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">LiveData</text>

  <!-- VM -> Repo (Suspend calls) -->
  <path d="M 590 200 L 635 200" stroke="#8B5CF6" stroke-width="2.5"/>
  <polygon points="635,200 625,195 625,205" fill="#8B5CF6"/>
  <text x="612" y="190" text-anchor="middle" fill="#8B5CF6" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">Suspend</text>

  <!-- Repo -> VM (Result) -->
  <path d="M 635 240 L 590 240" stroke="#10B981" stroke-width="2.5"/>
  <polygon points="590,240 600,235 600,245" fill="#10B981"/>
  <text x="612" y="255" text-anchor="middle" fill="#10B981" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">Result&lt;T&gt;</text>

  <!-- Repo -> Firebase (Async tasks) -->
  <path d="M 885 200 L 930 200" stroke="#10B981" stroke-width="2.5"/>
  <polygon points="930,200 920,195 920,205" fill="#10B981"/>
  <text x="907" y="190" text-anchor="middle" fill="#10B981" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">.get()</text>

  <!-- Firebase -> Repo (Snapshot) -->
  <path d="M 930 240 L 885 240" stroke="#F59E0B" stroke-width="2.5"/>
  <polygon points="885,240 895,235 895,245" fill="#F59E0B"/>
  <text x="907" y="255" text-anchor="middle" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">Snapshot</text>
</svg>